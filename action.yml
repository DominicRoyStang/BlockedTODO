name: BlockedTODO
description: Scans the repository for BlockedTODO comments and open issues when watched issues are closed
author: Dominic Roy-Stang

inputs:
  github-token:
    description: Token used to read watched issues, create notification issues, and manage the database artifact
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ${{ github.action_path }}/services/backend/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/services/backend
      run: npm ci

    - name: Download database artifact
      shell: bash
      working-directory: ${{ github.action_path }}/services/backend
      env:
        NODE_ENV: production
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DATABASE_FILE: ${{ github.action_path }}/services/backend/database.db
      run: npm run db:download

    - name: Migrate database
      shell: bash
      working-directory: ${{ github.action_path }}/services/backend
      env:
        NODE_ENV: production
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DATABASE_FILE: ${{ github.action_path }}/services/backend/database.db
      run: npm run db:migrate

    - name: Scan codebase
      shell: bash
      working-directory: ${{ github.action_path }}/services/backend
      env:
        NODE_ENV: production
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DATABASE_FILE: ${{ github.action_path }}/services/backend/database.db
        SCAN_DIR: ${{ github.workspace }}
      run: npm run scan

    - name: Upload database artifact
      uses: actions/upload-artifact@v4
      with:
        name: blockedtodo-database
        path: ${{ github.action_path }}/services/backend/database.db
        if-no-files-found: error
